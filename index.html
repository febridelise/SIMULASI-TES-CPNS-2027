<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Tes CPNS - SANG PNS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 1s ease-out;
        }

        .badge {
            background: linear-gradient(90deg, #e11d48, #cc0000);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .wishes {
            font-size: 1.4rem;
            font-weight: 600;
            color: #34d399;
            margin-bottom: 40px;
            padding: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .footer {
            margin-top: 20px;
        }

        .author {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 0.5px;
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsif HP */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            .wishes { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Badge Atas -->
        <div class="badge">Selamat Datang</div>
        
        <!-- Judul Utama -->
        <h1>SANG PNS</h1>
        
        <!-- Subtitle -->
        <p class="subtitle">Selamat mengerjakan<br><strong>Simulasi Tes CPNS</strong></p>
        
        <!-- Harapan / Sukses -->
        <div class="wishes">Semoga Sukses!</div>
        
        <!-- Tanda Tangan / Footer -->
        <div class="footer">
            <p class="author">Febri Delise</p>
            <p class="brand">INDONESIUM</p>
        </div>
    </div>

</body>
</html>
