<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SANG PNS - Simulasi CPNS</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --btn-grad: linear-gradient(90deg, #38bdf8, #818cf8);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #0f172a;
            --text-sub: #475569;
            --border: rgba(0, 0, 0, 0.1);
            --accent: #0284c7;
            --btn-grad: linear-gradient(90deg, #0284c7, #4f46e5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Partikel Canvas */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header & Theme Switcher */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand-section h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* Banner Sambutan */
        .welcome-banner {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .badge {
            background: linear-gradient(90deg, #e11d48, #cc0000);
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 12px;
        }

        /* Search Bar */
        .search-container {
            margin: 20px 0 10px;
        }

        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            text-align: center;
        }
        [data-theme="light"] .search-bar {
            background: rgba(0, 0, 0, 0.03);
        }

        /* Grid Paket */
        .package-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .package-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: translateY(0);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .package-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2);
        }

        .package-card h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .score-badge {
            font-size: 0.85rem;
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: inline-block;
            font-weight: 600;
        }

        .start-btn {
            margin-top: 15px;
            background: var(--btn-grad);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
        }
        [data-theme="light"] .start-btn { color: white; }

        .footer-text {
            text-align: center;
            margin-top: 50px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .package-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="main-container">
        <header>
            <div class="brand-section">
                <h1>SANG PNS</h1>
                <p style="color: var(--text-sub); font-size: 0.9rem;">INDONESIUM • Oleh Febri Delise</p>
            </div>
            <button class="theme-btn" id="theme-toggle">🌙 Mode Gelap</button>
        </header>

        <div class="welcome-banner">
            <div class="badge">Selamat Datang</div>
            <h2 style="margin-bottom: 8px;">Selamat mengerjakan Simulasi Tes CPNS</h2>
            <p style="color: var(--text-sub);">Pilih paket soal di bawah ini untuk memulai latihan. Semoga sukses!</p>
            
            <div class="search-container">
                <input type="text" class="search-bar" id="search-input" placeholder="🔍 Cari nomor paket (contoh: 4)...">
            </div>
        </div>

        <!-- Wadah Grid Otomatis 50 Paket -->
        <div class="package-grid" id="grid-container"></div>

        <p class="footer-text">© 2026 SANG PNS. All Rights Reserved.</p>
    </div>

    <script>
        // --- 1. GENERATOR 50 PAKET OTOMATIS ---
        const gridContainer = document.getElementById('grid-container');
        const repoName = "simulasitescpns"; // Nama folder induk Anda di GitHub

        for (let i = 1; i <= 50; i++) {
            // Cek simulasi nilai simpanan di lokal browser (Local Storage)
            // Anda bisa set data ini dari dalam file paket ujian dengan perintah: localStorage.setItem('skor-paket-4', '410')
            const savedScore = localStorage.getItem(`skor-paket-${i}`) || 'Belum Ujian';

            const card = document.createElement('a');
            card.className = 'package-card';
            card.href = `./${repoName}/paket${i}/`;
            card.setAttribute('data-number', i);

            card.innerHTML = `
                <div>
                    <h3>Paket ${i}</h3>
                    <p style="color: var(--text-sub); font-size: 0.85rem;">Simulasi TKP, TIU, TWK</p>
                </div>
                <div>
                    <div class="score-badge">Skor: ${savedScore}</div>
                    <button class="start-btn">Mulai</button>
                </div>
            `;
            gridContainer.appendChild(card);
        }

        // --- 2. FITUR PENCARIAN LIVE SEARCH ---
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.package-card');
            
            cards.forEach(card => {
                const paketNumber = card.getAttribute('data-number');
                if (query === '' || paketNumber.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // --- 3. FITUR DARK / LIGHT MODE SWITCHER ---
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.innerText = "🌙 Mode Gelap";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggle.innerText = "☀️ Mode Terang";
            }
        });

        // --- 4. ANIMASI PARTIKEL BACKROUND CANVAS ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
